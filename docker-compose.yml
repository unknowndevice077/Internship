# Local dev: `docker compose up db redis` and run Django/Vite on the host.
# Full stack: `docker compose --profile full up --build` then open http://localhost:8088

x-backend-env: &backend-env
  DATABASE_URL: postgres://sprintboard:sprintboard@db:5432/sprintboard
  REDIS_URL: redis://redis:6379/0
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-local-compose-key}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
  CSRF_TRUSTED_ORIGINS: http://localhost:8088
  SECURE_SSL_REDIRECT: "0"
  # plain http on localhost, so no HSTS
  SECURE_HSTS_SECONDS: "0"
  # nginx forwards the client IP
  NUM_PROXIES: "1"
  SENTRY_DSN: ${SENTRY_DSN:-}
  FRONTEND_URL: http://localhost:8088
  WEBHOOK_ALLOW_PRIVATE_URLS: ${WEBHOOK_ALLOW_PRIVATE_URLS:-0}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sprintboard
      POSTGRES_USER: sprintboard
      POSTGRES_PASSWORD: sprintboard
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintboard"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    image: sprintboard-backend:local
    profiles: [full]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      retries: 10

  worker:
    build: ./backend
    image: sprintboard-backend:local
    profiles: [full]
    command: celery -A config worker -l info --concurrency 2
    environment: *backend-env
    volumes:
      - media:/app/media
    depends_on:
      backend:
        condition: service_healthy

  beat:
    build: ./backend
    image: sprintboard-backend:local
    profiles: [full]
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  web:
    build: ./frontend
    image: sprintboard-web:local
    profiles: [full]
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
