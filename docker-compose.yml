services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sprintboard
      POSTGRES_USER: sprintboard
      POSTGRES_PASSWORD: sprintboard
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintboard"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"

volumes:
  pgdata:
