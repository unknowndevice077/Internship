# Render's free plan puts both APIs to sleep after 15 minutes with no traffic, and waking up takes
# up to a minute. This pings them every 10 minutes from 8am to 8pm Philippine time (00:00-12:00 UTC).
# Two services awake 12 hours a day is about 744 instance hours a month, just under Render's 750 free hours,
# so don't widen the window without upgrading one of them.
name: Keep the demo APIs awake

on:
  schedule:
    - cron: "*/10 0-11 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sprintboard API
        run: curl -fsS --max-time 120 --retry 2 https://sprintboard-api-vsnx.onrender.com/api/health/ || true
      - name: Vendora API
        run: curl -fsS --max-time 120 --retry 2 https://vendora-api-9qy1.onrender.com/api/health || true
