openapi: 3.0.3
info:
  title: Sprintboard API
  version: 0.1.0
  description: 'Multi-tenant project management. Send `X-Workspace: <slug>` on tenant
    endpoints.'
paths:
  /api/attachments/:
    get:
      operationId: attachments_list
      parameters:
      - in: query
        name: issue
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
          description: ''
    post:
      operationId: attachments_create
      tags:
      - attachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Attachment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Attachment'
          application/json:
            schema:
              $ref: '#/components/schemas/Attachment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/attachments/{id}/:
    get:
      operationId: attachments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: attachments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/attachments/{id}/download/:
    get:
      operationId: attachments_download_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/audit-log/:
    get:
      operationId: audit_log_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - attached
          - commented
          - created
          - deleted
          - moved
          - updated
        description: |-
          * `created` - Created
          * `updated` - Updated
          * `deleted` - Deleted
          * `moved` - Moved
          * `commented` - Commented
          * `attached` - Attached
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: entity_id
        schema:
          type: integer
      - in: query
        name: entity_type
        schema:
          type: string
      - in: query
        name: issue
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - audit-log
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
