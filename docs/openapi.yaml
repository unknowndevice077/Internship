components:
  schemas:
    ActionEnum:
      enum:
      - created
      - updated
      - deleted
      - moved
      - commented
      - attached
      type: string
      description: |-
        * `created` - Created
        * `updated` - Updated
        * `deleted` - Deleted
        * `moved` - Moved
        * `commented` - Commented
        * `attached` - Attached
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue:
          type: integer
        file:
          type: string
          format: uri
          writeOnly: true
        name:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        content_type:
          type: string
          readOnly: true
        uploaded_by:
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          readOnly: true
        download_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - download_url
      - file
      - id
      - issue
      - name
      - size
      - uploaded_by
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        entity_type:
          type: string
          maxLength: 40
        entity_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        entity_label:
          type: string
          maxLength: 255
        changes: {}
        issue:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - entity_id
      - entity_type
      - id
    Board:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        name:
          type: string
          maxLength: 120
        kind:
          $ref: '#/components/schemas/BoardKindEnum'
      required:
      - id
      - name
      - project
    BoardKindEnum:
      enum:
      - kanban
      - scrum
      type: string
      description: |-
        * `kanban` - Kanban
        * `scrum` - Scrum
    CategoryEnum:
      enum:
      - todo
      - in_progress
      - done
      type: string
      description: |-
        * `todo` - To do
        * `in_progress` - In progress
        * `done` - Done
    Checkout:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/PlanEnum'
      required:
      - plan
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue:
          type: integer
        author:
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          readOnly: true
        body:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - body
      - created_at
      - id
      - issue
      - updated_at
    EventsEnum:
      enum:
      - issue.created
      - issue.updated
      - issue.moved
      - issue.deleted
      - comment.commented
      - attachment.attached
      - sprint.created
      - sprint.updated
      - project.created
      - membership.created
