        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/verify-email/resend/:
    post:
      operationId: auth_verify_email_resend_create
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/billing/:
    get:
      operationId: billing_retrieve
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Plan, subscription status, usage and plans
  /api/billing/checkout/:
    post:
