  /api/issues/:
    get:
      operationId: issues_list
      parameters:
      - in: query
        name: assignee
        schema:
          type: integer
      - in: query
        name: backlog
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - highest
          - low
          - lowest
          - medium
        description: |-
          * `lowest` - Lowest
          * `low` - Low
          * `medium` - Medium
          * `high` - High
          * `highest` - Highest
      - in: query
        name: project
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: sprint
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - bug
          - epic
          - story
          - task
        description: |-
          * `task` - Task
          * `bug` - Bug
          * `story` - Story
